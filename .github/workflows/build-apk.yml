name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Fix and Build
        run: |
          DUMMY='{"project_info":{"project_number":"123","project_id":"jarvis-dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:dummy","android_client_info":{"package_name":"com.jarvis.android"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}]}]}'
          find . -type d -name app | while read d; do echo "$DUMMY" > "$d/google-services.json" || true; done
          echo "$DUMMY" > app/google-services.json 2>/dev/null || true
          find . -name "gradle-wrapper.properties" -exec sed -i "s/gradle-.*-bin.zip/gradle-9.3.1-bin.zip/g" {} \; || true
          gradle assembleDebug --no-daemon -x lint --stacktrace
          
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: |
            **/build/outputs/apk/debug/*.apk
