name: Build JARVIS APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Create keystore and files
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore || true
          mkdir -p app
          echo '{"project_info":{"project_number":"1234567890","project_id":"jarvis-dummy","storage_bucket":"jarvis-dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:abc123","android_client_info":{"package_name":"com.aistudio.jarvis.kxaqvt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaDummyKey1234567890"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          ls -l local.properties
      - name: Add Extended Icons Dependency and Layout Fallback
        run: |
          echo 'dependencies { implementation("androidx.compose.material:material-icons-extended:1.6.8") }' >> app/build.gradle.kts || true
          mkdir -p app/src/main/res/layout
          if [ ! -f app/src/main/res/layout/widget_jarvis.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical"><TextView android:id="@+id/widget_text" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Jarvis Widget"/></LinearLayout>' > app/src/main/res/layout/widget_jarvis.xml
          fi
      - name: Build APK
        run: gradle assembleDebug --no-daemon --no-build-cache
      - uses: actions/upload-artifact@v5
        with:
          name: JARVIS-APK-FINAL
          path: app/build/outputs/apk/debug/*.apk
          
