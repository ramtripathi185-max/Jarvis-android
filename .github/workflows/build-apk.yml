      - name: Build APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -1)
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x $GRADLEW_PATH
          DIR=$(dirname $GRADLEW_PATH)
          cd $DIR/..
          echo "Building from: $(pwd)"
          ./$(basename $GRADLEW_PATH) assembleDebug --no-daemon -x lint || $GRADLEW_PATH assembleDebug --no-daemon -x lint
