name: Build JARVIS APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create google-services.json
        run: |
          mkdir -p app
          echo '{"project_info":{"project_number":"1"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"com.aistudio.jarvis.kxaqvt"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: JARVIS-APK
          path: app/build/outputs/apk/debug/*.apk
