name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          echo "Fixing Line 72 error..."
          # Line 72 वाला पूरा block हटाओ
          find . -name "build.gradle.kts" -exec sed -i '/googleServices {/,/}/d' {} \; || true
          find . -name "build.gradle.kts" -exec sed -i '/MissingGoogleServicesStrategy/d' {} \; || true
          find . -name "build.gradle.kts" -exec sed -i '/googleServices/d' {} \; || true
          find . -name "*.gradle*" -exec sed -i '/com.google.gms.google-services/d' {} \; || true
          find . -name "*.gradle*" -exec sed -i '/com.google.gms/d' {} \; || true
          find . -name "*.gradle*" -exec sed -i '/google-services/d' {} \; || true

          echo "Creating dummy json"
          mkdir -p app
          echo '{"project_info":{"project_number":"1"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"com.aistudio.jarvis.kxaqvt"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json

          chmod +x ./gradlew || true
          ./gradlew assembleDebug --no-daemon -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-APK
          path: "**/build/outputs/apk/debug/*.apk"
